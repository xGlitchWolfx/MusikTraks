<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Favoritas</ion-title>
    <img slot="end" class="toolbar-logo" [src]="(avatar$ | async) || 'assets/MTIconApp.png'" alt="MusicTraks" />
  </ion-toolbar>
</ion-header>

<ion-content fullscreen class="favorites-page">
  <section class="score-card">
    <img src="assets/MTIconApp.png" alt="MusicTraks" />
    <div>
      <p>Biblioteca</p>
      <h1>Tus canciones favoritas</h1>
    </div>
  </section>

  <ng-container *ngIf="favorites$ | async as favorites">
    <section class="empty-card" *ngIf="!favorites.length">
      <h2>Aún no hay favoritas</h2>
      <p>Ve a Discover o TRAK y toca el corazón de una canción.</p>
    </section>

    <section class="liked-list" *ngIf="favorites.length">
      <article class="liked-card" *ngFor="let song of favorites; let index = index">
        <span class="rank">{{ index + 1 }}</span>
        <img [src]="song.cover" [alt]="song.title" />
        <div class="song-copy">
          <h2>{{ song.title }}</h2>
          <p>{{ song.artist }} · {{ song.album }}</p>
          <app-track-player [previewUrl]="song.preview"></app-track-player>
        </div>
        <button
          class="favorite-button is-liked"
          type="button"
          (click)="removeFavorite(song)"
          aria-label="Quitar de favoritas"
        ></button>
      </article>
    </section>
  </ng-container>
</ion-content>
