<ion-content fullscreen class="intro-screen" [class.is-leaving]="isLeaving">
  <main class="intro-shell">
    <section class="splash-card">
      <img src="assets/Music Traks SplasIco.png" alt="MusicTraks" />
      <span class="status-pill">MusicTraks</span>
    </section>

    <section class="intro-copy">
      <h1>Tu panel de canciones</h1>
      <p>Busca canciones, escucha previews y guarda tus sonidos favoritos sin salir de la app.</p>
    </section>

    <ion-button expand="block" class="primary-action" (click)="enterApp()">Entrar</ion-button>
  </main>
</ion-content>
